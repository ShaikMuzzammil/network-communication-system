<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#4c51bf" stroke-width="2"/>
  
  <!-- Socket/Connection Icon -->
  <g transform="translate(30, 30)">
    <!-- Main socket body -->
    <rect x="10" y="15" width="40" height="35" rx="5" ry="5" fill="none" stroke="url(#iconGrad)" stroke-width="3"/>
    
    <!-- Connection points (pins) -->
    <circle cx="20" cy="25" r="3" fill="url(#iconGrad)"/>
    <circle cx="30" cy="25" r="3" fill="url(#iconGrad)"/>
    <circle cx="40" cy="25" r="3" fill="url(#iconGrad)"/>
    
    <circle cx="20" cy="35" r="3" fill="url(#iconGrad)"/>
    <circle cx="30" cy="35" r="3" fill="url(#iconGrad)"/>
    <circle cx="40" cy="35" r="3" fill="url(#iconGrad)"/>
    
    <!-- Cable/Connector -->
    <path d="M30 50 L30 55 L20 65" stroke="url(#iconGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 55 L40 65" stroke="url(#iconGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Signal waves -->
    <path d="M45 10 Q52 10 52 17" stroke="url(#iconGrad)" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M48 6 Q58 6 58 16" stroke="url(#iconGrad)" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
</svg>
